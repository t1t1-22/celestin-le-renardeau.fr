name: CI et déploiement Célestin

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le code et Docker
        run: |
          set -eu
          sh -n scripts/deploy.sh
          node --check server.mjs
          node --check public/site.js
          node --check public/admin.js
          docker compose config --quiet
          docker build -t celestin-ci .
      - name: Tester les pages, les API et la connexion admin
        run: |
          set -eu
          container=$(docker run -d -e ADMIN_PASSWORD="Test-Secure-Password-1234" -p 127.0.0.1::8080 celestin-ci)
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          address=$(docker port "$container" 8080/tcp)
          curl --retry 10 --retry-connrefused --retry-delay 1 --max-time 5 -fsS "http://$address/" > "$RUNNER_TEMP/celestin.html"
          grep -Fq "Pars à l'aventure" "$RUNNER_TEMP/celestin.html"
          curl -fsS "http://$address/admin" | grep -Fq 'L\x27ATELIER' || curl -fsS "http://$address/admin" | grep -Fq 'login-form'
          curl -fsS "http://$address/health" | grep -Fq '"ok":true'
          curl -fsS "http://$address/api/content" | grep -Fq '"items"'
          status=$(curl --max-time 5 -sS -o /dev/null -w '%{http_code}' "http://$address/api/admin/items")
          test "$status" = 401
          status=$(curl --max-time 5 -sS -o /dev/null -w '%{http_code}' "http://$address/__ci_missing_page__")
          test "$status" = 404

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: celestin-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Installer sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
      - name: Déployer le commit testé sur Ubuntu
        env:
          SSH_HOST: ${{ secrets.CELESTIN_SSH_HOST }}
          SSH_USER: ${{ secrets.CELESTIN_SSH_USER }}
          SSHPASS: ${{ secrets.CELESTIN_SSH_PASSWORD }}
          SSH_KNOWN_HOSTS: ${{ secrets.CELESTIN_SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.CELESTIN_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.CELESTIN_DEPLOY_PATH }}
        run: |
          set -eu
          : "${SSH_HOST:?Secret CELESTIN_SSH_HOST absent}"
          : "${SSH_USER:?Secret CELESTIN_SSH_USER absent}"
          : "${SSHPASS:?Secret CELESTIN_SSH_PASSWORD absent}"
          : "${SSH_KNOWN_HOSTS:?Secret CELESTIN_SSH_KNOWN_HOSTS absent}"
          : "${DEPLOY_PATH:?Variable CELESTIN_DEPLOY_PATH absente}"
          if [[ ! "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9._/-]+$ ]]; then
            echo "CELESTIN_DEPLOY_PATH doit être un chemin absolu sans espaces." >&2
            exit 1
          fi
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          sshpass -e ssh -T -p "$SSH_PORT" -l "$SSH_USER" \
            -o PreferredAuthentications=password,keyboard-interactive -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=15 \
            -- "$SSH_HOST" "sh -s -- '$DEPLOY_PATH' '$GITHUB_SHA'" < scripts/deploy.sh
