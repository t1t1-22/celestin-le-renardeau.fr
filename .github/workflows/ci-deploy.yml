name: WordPress vierge - CI et déploiement

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CELESTIN_DB_PASSWORD: ci_only_wordpress_secret_long
      CELESTIN_DB_ROOT_PASSWORD: ci_only_root_wordpress_secret_long
    steps:
      - uses: actions/checkout@v4
      - name: Validation des scripts et de Compose
        run: |
          set -eu
          sh -n scripts/deploy.sh
          sh -n scripts/enable-celestin-proxy-uploads.sh
          grep -Fq 'client_max_body_size 80m' scripts/enable-celestin-proxy-uploads.sh
          sh -n scripts/ensure-wordpress-secrets.sh
          docker compose config --quiet
          test ! -e wp-content
          test ! -e public
          test ! -e Dockerfile.wordpress
      - name: Démarrage des services officiels WordPress et MariaDB
        run: |
          set -eu
          docker network create celestin_proxy
          docker compose -p celestin-ci up -d --build --wait --wait-timeout 240
      - name: Tester une installation WordPress vierge
        run: |
          set -eu
          docker compose -p celestin-ci exec -T web nginx -t
          docker compose -p celestin-ci exec -T web wget -q -O /dev/null http://127.0.0.1:8080/wp-admin/install.php
          docker compose -p celestin-ci exec -T wordpress sh -c 'test ! -e /var/www/html/wp-content/mu-plugins/celestin-content.php && test ! -e /var/www/html/wp-content/themes/celestin'
          docker compose -p celestin-ci exec -T wordpress php -r 'if (!extension_loaded("gd")) exit(1);'
          docker compose -p celestin-ci exec -T wordpress php -r 'if (ini_get("upload_max_filesize") !== "64M" || ini_get("post_max_size") !== "72M" || ini_get("memory_limit") !== "256M") { fwrite(STDERR, "Limites PHP invalides\n"); exit(1); }'
          docker compose -p celestin-ci exec -T wordpress sh -c 'test -r /usr/local/etc/php/conf.d/zz-celestin-uploads.ini'
      - name: Nettoyage de la seule stack de test
        if: always()
        run: |
          docker compose -p celestin-ci logs --tail=40 web wordpress db || true
          docker compose -p celestin-ci down -v || true

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: celestin-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Installer SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
      - name: Installer WordPress vierge sur Ubuntu
        env:
          SSH_HOST: ${{ secrets.CELESTIN_SSH_HOST }}
          SSH_USER: ${{ secrets.CELESTIN_SSH_USER }}
          SSHPASS: ${{ secrets.CELESTIN_SSH_PASSWORD }}
          SSH_KNOWN_HOSTS: ${{ secrets.CELESTIN_SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.CELESTIN_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.CELESTIN_DEPLOY_PATH }}
        run: |
          set -eu
          : "${SSH_HOST:?Hôte SSH absent}"
          : "${SSH_USER:?Utilisateur SSH absent}"
          : "${SSHPASS:?Mot de passe SSH absent}"
          : "${SSH_KNOWN_HOSTS:?Empreinte SSH absente}"
          : "${DEPLOY_PATH:?Dossier de déploiement absent}"
          if [[ ! "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9._/-]+$ ]]; then
            echo "Chemin du déploiement invalide." >&2
            exit 1
          fi
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          sshpass -e ssh -T -p "$SSH_PORT" -l "$SSH_USER" \
            -o PreferredAuthentications=password,keyboard-interactive -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=15 \
            -- "$SSH_HOST" "sh -s -- '$DEPLOY_PATH' '$GITHUB_SHA'" < scripts/deploy.sh
