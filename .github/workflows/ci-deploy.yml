name: CI et déploiement Célestin

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CELESTIN_DB_PASSWORD: ci_test_wordpress_2026_secret
      CELESTIN_DB_ROOT_PASSWORD: ci_root_wordpress_2026_secret
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les scripts et Compose
        run: |
          set -eu
          sh -n scripts/deploy.sh
          sh -n scripts/ensure-wordpress-secrets.sh
          sh -n wp-entrypoint.sh
          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT
          sh scripts/ensure-wordpress-secrets.sh "$temp_dir"
          test -s "$temp_dir/.env"
          grep -Eq '^CELESTIN_DB_PASSWORD=[0-9a-f]{64}
          docker compose config --quiet
      - name: Démarrer WordPress et MariaDB en conteneurs isolés
        run: |
          set -eu
          docker network create celestin_proxy
          docker compose -p celestin-ci up -d --build --wait --wait-timeout 240
      - name: Vérifier la syntaxe du thème et les pages
        run: |
          set -eu
          docker compose -p celestin-ci exec -T web nginx -t
          docker compose -p celestin-ci exec -T wordpress php -l /var/www/html/wp-content/mu-plugins/celestin-content.php
          for page in functions.php front-page.php header.php footer.php archive.php single.php index.php 404.php; do
            docker compose -p celestin-ci exec -T wordpress php -l "/var/www/html/wp-content/themes/celestin/$page"
          done
          docker compose -p celestin-ci exec -T web wget -q -O - http://127.0.0.1:8080/_health | grep -Fq ok
          docker compose -p celestin-ci exec -T web wget -q -O /dev/null http://127.0.0.1:8080/images/logo.webp
          docker compose -p celestin-ci exec -T web wget -q -O /dev/null http://127.0.0.1:8080/wp-admin/install.php
      - name: Journaux en cas de panne et nettoyage CI
        if: always()
        run: |
          docker compose -p celestin-ci ps || true
          docker compose -p celestin-ci logs --tail=75 wordpress db web || true
          docker compose -p celestin-ci down -v || true

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: celestin-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Installer sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
      - name: Déployer le commit testé sur Ubuntu
        env:
          SSH_HOST: ${{ secrets.CELESTIN_SSH_HOST }}
          SSH_USER: ${{ secrets.CELESTIN_SSH_USER }}
          SSHPASS: ${{ secrets.CELESTIN_SSH_PASSWORD }}
          SSH_KNOWN_HOSTS: ${{ secrets.CELESTIN_SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.CELESTIN_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.CELESTIN_DEPLOY_PATH }}
        run: |
          set -eu
          : "${SSH_HOST:?Secret CELESTIN_SSH_HOST absent}"
          : "${SSH_USER:?Secret CELESTIN_SSH_USER absent}"
          : "${SSHPASS:?Secret CELESTIN_SSH_PASSWORD absent}"
          : "${SSH_KNOWN_HOSTS:?Secret CELESTIN_SSH_KNOWN_HOSTS absent}"
          : "${DEPLOY_PATH:?Variable CELESTIN_DEPLOY_PATH absente}"
          if [[ ! "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9._/-]+$ ]]; then
            echo "CELESTIN_DEPLOY_PATH doit être un chemin absolu sans espaces." >&2
            exit 1
          fi
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          sshpass -e ssh -T -p "$SSH_PORT" -l "$SSH_USER" \
            -o PreferredAuthentications=password,keyboard-interactive -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=15 \
            -- "$SSH_HOST" "sh -s -- '$DEPLOY_PATH' '$GITHUB_SHA'" < scripts/deploy.sh
 "$temp_dir/.env"
          grep -Eq '^CELESTIN_DB_ROOT_PASSWORD=[0-9a-f]{64}
          docker compose config --quiet
      - name: Démarrer WordPress et MariaDB en conteneurs isolés
        run: |
          set -eu
          docker network create celestin_proxy
          docker compose -p celestin-ci up -d --build --wait --wait-timeout 240
      - name: Vérifier la syntaxe du thème et les pages
        run: |
          set -eu
          docker compose -p celestin-ci exec -T web nginx -t
          docker compose -p celestin-ci exec -T wordpress php -l /var/www/html/wp-content/mu-plugins/celestin-content.php
          for page in functions.php front-page.php header.php footer.php archive.php single.php index.php 404.php; do
            docker compose -p celestin-ci exec -T wordpress php -l "/var/www/html/wp-content/themes/celestin/$page"
          done
          docker compose -p celestin-ci exec -T web wget -q -O - http://127.0.0.1:8080/_health | grep -Fq ok
          docker compose -p celestin-ci exec -T web wget -q -O /dev/null http://127.0.0.1:8080/images/logo.webp
          docker compose -p celestin-ci exec -T web wget -q -O /dev/null http://127.0.0.1:8080/wp-admin/install.php
      - name: Journaux en cas de panne et nettoyage CI
        if: always()
        run: |
          docker compose -p celestin-ci ps || true
          docker compose -p celestin-ci logs --tail=75 wordpress db web || true
          docker compose -p celestin-ci down -v || true

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: celestin-production
