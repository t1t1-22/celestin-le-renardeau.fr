services:
  web:
    build: .
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/_health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      celestin_proxy:
        aliases:
          - celestin-web
      wordpress_internal: {}

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${CELESTIN_DB_PASSWORD:?Mot de passe SQL absent}
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && in_array('https', explode(',', $$_SERVER['HTTP_X_FORWARDED_PROTO']), true)) {
            $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wordpress_blank_v1:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$r=@get_headers(\"http://127.0.0.1/wp-login.php\"); if (!$$r || !preg_match(\"~^HTTP/[^ ]+ (200|302)~\", $$r[0])) exit(1);'"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 18
    networks:
      wordpress_internal: {}

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${CELESTIN_DB_PASSWORD:?Mot de passe SQL absent}
      MARIADB_ROOT_PASSWORD: ${CELESTIN_DB_ROOT_PASSWORD:?Mot de passe root SQL absent}
    volumes:
      - db_blank_v1:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 16
      start_period: 30s
    networks:
      wordpress_internal: {}

volumes:
  wordpress_blank_v1:
  db_blank_v1:

networks:
  wordpress_internal:
  celestin_proxy:
    external: true
    name: celestin_proxy
