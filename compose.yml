services:
  web:
    build: .
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 6
    networks:
      celestin_proxy:
        aliases:
          - celestin-web

networks:
  celestin_proxy:
    external: true
    name: celestin_proxy
